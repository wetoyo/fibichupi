{% extends "header.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto bg-slate-800 border border-slate-700 rounded-lg p-6 mt-12">
  <h1 class="text-2xl font-bold mb-2">Login</h1>
  <p class="text-sm text-slate-400 mb-4">Enter your credentials.</p>

  <form method="POST" class="space-y-3">
    <input type="text" name="user_id" placeholder="Username" required
           class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2">
    <input type="password" name="password" placeholder="Password" required
           class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2">
    <button type="submit" name="sub1"
            class="w-full bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded font-semibold">Login</button>
  </form>

  {% if error %}<p class="text-red-400 text-sm mt-3">{{ error }}</p>{% endif %}

  <p class="text-sm text-slate-400 mt-4">Don't have an account?
    <a href="/register" class="text-emerald-400 hover:underline">Register</a>
  </p>
</div>
{% endblock %}
