{% extends "header.html" %}

{% block title %}Create Market{% endblock %}

{% block content %}
<div class="mb-4">
  <a href="/" class="text-sm text-slate-400 hover:text-emerald-400">&larr; Markets</a>
</div>

<div class="bg-slate-800 border border-slate-700 rounded-lg p-6 max-w-xl">
  <h1 class="text-2xl font-bold mb-4">Create a market</h1>
  <form method="POST" class="space-y-4">
    <div>
      <label class="block text-sm text-slate-400 mb-1">Question</label>
      <input type="text" name="title" required placeholder="Will X happen by Y?"
             class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2">
    </div>
    <div>
      <label class="block text-sm text-slate-400 mb-1">Description</label>
      <textarea name="description" rows="4" placeholder="Resolution criteria, details, etc."
                class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2"></textarea>
    </div>
    {% if error %}<p class="text-red-400 text-sm">{{ error }}</p>{% endif %}
    <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded font-semibold">Create</button>
  </form>
</div>
{% endblock %}
